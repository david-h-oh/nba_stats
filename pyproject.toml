[project]
name = "nba-stats"
version = "0.1.0"
description = "NBA stats analysis and notebook environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "nba-api>=1.2.1",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "isort>=5.10",
    "flake8>=6.0",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "ipython>=8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
